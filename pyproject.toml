[tool.vercel]
entrypoint = "dashboards/app.py"

[project]
name = "personal-data-analytics"
version = "0.1.0"
description = "Personal data analytics pipeline for crypto, stocks, forex and assets"
requires-python = ">=3.10"
dependencies = [
    "duckdb==1.5.5",
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "streamlit==1.64.0",
    "plotly==7.1.0",
    "altair==6.3.0",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "metricflow>=0.213.0",
]
